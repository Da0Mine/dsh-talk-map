name: publish

# 手动触发的 OIDC 发布。默认不再随标签自动跑：
# 发布是在本机用 npm CLI 完成的，创建 GitHub Release 会顺带打 v* 标签，而旧的 `push: tags: v*`
# 触发会让这个 job 每次都执行一遍 `npm publish` → "cannot publish over previously published
# version" → 每个版本发一封失败邮件。现在只在 Actions 页面手动点，且版本已存在时直接跳过。
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC 换取 npm 的短期发布凭据

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 刻意不设 registry-url：它会写一个占位 token 到 .npmrc，
          # 而 trusted publishing 要的是"没有 token、走 OIDC"。

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Upgrade npm (OIDC 发布需要 >= 11.5.1)
        run: npm install -g npm@latest

      - name: Skip when this version already exists on npm
        id: exists
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "dsh-talk-map@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "dsh-talk-map@$version already on npm, skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.exists.outputs.published == 'false'
        run: npm publish --access public --provenance
