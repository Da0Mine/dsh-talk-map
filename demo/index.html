<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>对话地图 · dsh-talk-map 交互演示</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1d2026;
    --card: #23262d;
    --border: #333a45;
    --text: #cfd6e3;
    --dim: #8b93a3;
    --accent: #ffd66a;
    --green: #34c759;
    --red: #f24e4e;
    --amber: #f2a63c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  /* ============ 顶栏（复刻插件 toolbar） ============ */
  .toolbar {
    position: fixed; inset: 0 0 auto 0; height: 52px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    background: rgba(29, 32, 38, 0.92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
    z-index: 50;
  }
  .toolbar .brand { font-weight: 700; font-size: 15px; letter-spacing: 1px; color: #eef2f9; }
  .toolbar .spacer { flex: 1; }
  .searchbox {
    width: 300px; height: 30px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    display: flex; align-items: center; padding: 0 10px; gap: 6px;
    color: var(--dim); font-size: 12.5px; cursor: text;
  }
  .searchbox input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 12.5px;
  }
  .searchbox .kbd {
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 10px;
  }
  .fontbtns { display: flex; gap: 6px; align-items: center; }
  .fontbtns button {
    height: 28px; min-width: 28px; padding: 0 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 12px; cursor: pointer;
  }
  .fontbtns button:hover { border-color: var(--accent); color: var(--accent); }

  /* ============ 画布 ============ */
  #board {
    position: fixed; inset: 52px 0 0 0;
    overflow: hidden; cursor: grab;
    background-image: radial-gradient(circle, #262b33 1.1px, transparent 1.1px);
    background-size: 22px 22px;
  }
  #board.dragging { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  /* 工作区框架 */
  .frame {
    position: absolute;
    border: 1.5px dashed #4a5568;
    border-radius: 14px;
    background: rgba(35, 38, 45, 0.35);
    padding: 30px 14px 14px;
  }
  .frame .label {
    position: absolute; top: -12px; left: 18px;
    background: var(--card); border: 1px solid var(--border); border-radius: 9px;
    padding: 2px 12px; font-size: 12px; color: var(--text);
    display: flex; gap: 8px; align-items: center;
  }
  .frame .label .count { color: var(--dim); }
  .frame .label .stackbadge {
    background: var(--accent); color: #16181d; font-weight: 700;
    border-radius: 7px; padding: 0 7px; font-size: 11px; cursor: pointer;
  }
  .frame .inner {
    display: grid; grid-template-columns: repeat(var(--cols, 3), 224px);
    gap: 14px 48px; align-items: start;
  }

  /* ============ 卡片（与插件同款） ============ */
  .card {
    width: 224px; min-height: 120px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px 10px;
    position: absolute;
    cursor: grab;
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: #4a5568; }
  .card .title { font-size: 14px; font-weight: 700; color: #e8edf6; display: flex; align-items: center; gap: 6px; }
  .card .pin { color: var(--accent); font-size: 12px; }
  .card .body {
    font-size: 12px; color: var(--dim); margin-top: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .meta { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
  .card .time { font-size: 11px; color: #6b7382; }
  .card .chip {
    font-size: 10.5px; padding: 2px 9px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip.running { background: rgba(255,255,255,0.09); color: #dfe6f1; }
  .chip.running::before { content: "●"; color: #fff; font-size: 8px; }
  .chip.done { background: rgba(52,199,89,0.14); color: var(--green); }
  .chip.error { background: rgba(242,78,78,0.15); color: var(--red); }
  .chip.waiting { background: rgba(242,166,60,0.15); color: var(--amber); }

  /* 状态灯（呼吸光环，复刻 cardLamp*） */
  .card.lamp-running { animation: lampRun 2.6s ease-in-out infinite; }
  .card.lamp-done { animation: lampDone 3.2s ease-in-out infinite; }
  .card.lamp-error { animation: lampErr 2.4s ease-in-out infinite; }
  .card.lamp-waiting { animation: lampWait 3.6s ease-in-out infinite; }
  @keyframes lampRun {
    0%,100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.35), 0 0 18px 2px rgba(255,255,255,0.10); }
    50% { box-shadow: 0 0 0 1px rgba(255,255,255,0.55), 0 0 30px 5px rgba(255,255,255,0.16); }
  }
  @keyframes lampDone {
    0%,100% { box-shadow: 0 0 0 1px rgba(52,199,89,0.40), 0 0 16px 2px rgba(52,199,89,0.22); }
    50% { box-shadow: 0 0 0 1px rgba(52,199,89,0.65), 0 0 34px 8px rgba(52,199,89,0.16); }
  }
  @keyframes lampErr {
    0%,100% { box-shadow: 0 0 0 1px rgba(242,78,78,0.45), 0 0 16px 2px rgba(242,78,78,0.22); }
    50% { box-shadow: 0 0 0 1px rgba(242,78,78,0.7), 0 0 36px 9px rgba(242,78,78,0.17); }
  }
  @keyframes lampWait {
    0%,100% { box-shadow: 0 0 0 1px rgba(242,166,60,0.4), 0 0 16px 2px rgba(242,166,60,0.2); }
    50% { box-shadow: 0 0 0 1px rgba(242,166,60,0.65), 0 0 32px 7px rgba(242,166,60,0.15); }
  }
  /* 运行中的 conic 流光（复刻 cardLampRunning::after） */
  .card.lamp-running::after {
    content: ""; position: absolute; inset: -5px; border-radius: 16px;
    background: conic-gradient(from var(--ring, 0deg),
      rgba(255,255,255,0) 0deg, rgba(255,255,255,0) 190deg,
      rgba(255,255,255,0.18) 250deg, rgba(255,255,255,0.55) 292deg,
      rgba(255,255,255,1) 325deg, rgba(255,255,255,0.4) 352deg, rgba(255,255,255,0) 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    padding: 1.6px; pointer-events: none;
    animation: ringsweep 1.8s linear infinite;
  }
  @property --ring { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @keyframes ringsweep { to { --ring: 360deg; } }

  /* ============ 连线（SVG 层） ============ */
  svg#wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  svg#wires path.edge {
    fill: none; stroke: rgba(200,206,216,0.45); stroke-width: 1.4;
    stroke-dasharray: 6 5; stroke-linecap: round;
  }
  svg#wires path.arrow { fill: rgba(200,206,216,0.5); }
  svg#wires path.edge.hot { stroke: rgba(255,214,106,0.8); }
  svg#wires .drawing { stroke: var(--accent); stroke-dasharray: none; }

  /* ============ 堆叠抽屉 ============ */
  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(10,11,14,0.55);
    z-index: 80; display: none; align-items: center; justify-content: center;
  }
  .drawer-backdrop.open { display: flex; }
  .drawer {
    width: min(860px, 92vw); max-height: 76vh;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 40px 120px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; overflow: hidden;
    animation: drawerIn 0.24s cubic-bezier(0.4,0,0.6,1);
  }
  @keyframes drawerIn { from { transform: translateY(14px); opacity: 0; } }
  .drawer .head {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px 10px; font-size: 15px; font-weight: 700; color: #eef2f9;
  }
  .drawer .head .count { font-size: 12px; color: var(--dim); font-weight: 400; }
  .drawer .head .close { margin-left: auto; cursor: pointer; color: var(--dim); font-size: 18px; }
  .drawer .searchrow { display: flex; gap: 8px; padding: 4px 20px 12px; }
  .drawer .searchrow input {
    flex: 1; height: 34px; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 0 12px; color: var(--text); outline: none; font-size: 13px;
  }
  .drawer .searchrow button {
    height: 34px; padding: 0 16px; background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .drawer .grid .dcard { position: relative; cursor: pointer; }
  .drawer .grid .dcard::after { inset: -4px; border-radius: 14px; }
  .drawer .grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    padding: 6px 20px 20px; overflow: auto;
    background-image: radial-gradient(circle, #262b33 1px, transparent 1px);
    background-size: 22px 22px;
  }

  /* ============ 右键菜单 ============ */
  .ctxmenu {
    position: fixed; z-index: 90; min-width: 168px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.5);
    padding: 5px; display: none;
  }
  .ctxmenu.open { display: block; }
  .ctxmenu .item {
    padding: 7px 12px; border-radius: 7px; font-size: 12.5px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; color: var(--text);
  }
  .ctxmenu .item:hover { background: rgba(255,255,255,0.07); }
  .ctxmenu .item .ico { width: 16px; text-align: center; opacity: 0.8; }
  .ctxmenu .sep { height: 1px; background: var(--border); margin: 4px 8px; }

  /* ============ 全局搜索面板 ============ */
  .gsearch {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    width: min(720px, 90vw); z-index: 85;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.55);
    display: none; overflow: hidden;
  }
  .gsearch.open { display: block; animation: drawerIn 0.2s cubic-bezier(0.4,0,0.6,1); }
  .gsearch .gshead { padding: 14px 18px 10px; font-size: 13px; color: #eef2f9; }
  .gsearch .gshit {
    padding: 10px 18px 14px; border-top: 1px solid rgba(255,255,255,0.05); cursor: pointer;
  }
  .gsearch .gshit:hover { background: rgba(255,255,255,0.04); }
  .gsearch mark { background: rgba(255,214,106,0.85); color: #16181d; border-radius: 3px; padding: 0 2px; }

  /* ============ 说明浮条 ============ */
  .hintbar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 60; display: flex; gap: 16px; align-items: center;
    background: rgba(29,32,38,0.9); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 20px; font-size: 12px; color: var(--dim);
    backdrop-filter: blur(6px); pointer-events: none;
    transition: opacity 0.4s;
  }
  .hintbar b { color: var(--text); font-weight: 600; }
  .hintbar .dot { width: 3px; height: 3px; border-radius: 50%; background: #4a5568; }

  /* 新建卡片落点提示 */
  .card.spawning { animation: spawn 0.4s cubic-bezier(0.16,1,0.3,1); }
  @keyframes spawn { from { transform: scale(0.7); opacity: 0; } }

  .toast {
    position: fixed; top: 66px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 8px 18px; font-size: 12.5px; z-index: 95;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="toolbar">
  <button class="brand" id="backBtn" style="background:none;border:none;cursor:pointer;color:inherit">‹ 返回</button>
  <div class="spacer"></div>
  <div class="searchbox" id="gsTrigger">
    <span>🔍</span>
    <input id="gsInput" placeholder="搜地图上的卡片（标题/正文），回车开始" />
    <span class="kbd">Esc</span>
  </div>
  <div class="fontbtns">
    <button id="fontMinus">A−</button>
    <button id="fontPlus">A+</button>
    <button id="fontReset">默认</button>
  </div>
</div>

<div id="board"><div id="world">
  <svg id="wires"></svg>
</div></div>

<div class="drawer-backdrop" id="drawerBackdrop">
  <div class="drawer" id="drawer">
    <div class="head"><span id="drawerTitle">工作区</span><span class="count" id="drawerCount"></span><span style="flex:1"></span><span class="close" id="drawerClose">✕</span></div>
    <div class="searchrow">
      <input id="drawerSearch" placeholder="搜这个抽屉里的卡片，回车开始" />
      <button id="drawerSearchBtn">搜索</button>
    </div>
    <div class="grid" id="drawerGrid"></div>
  </div>
</div>

<div class="gsearch" id="gsearch">
  <div class="gshead">搜索地图「<span id="gsq"></span>」</div>
  <div id="gsHits"></div>
</div>

<div class="ctxmenu" id="ctxmenu"></div>
<div class="toast" id="toast"></div>

<div class="hintbar" id="hintbar">
  <span><b>拖动</b> 平移画布</span><span class="dot"></span>
  <span><b>拖卡片</b> 摆放位置</span><span class="dot"></span>
  <span><b>双击空白</b> 新对话</span><span class="dot"></span>
  <span><b>从边拉到卡</b> 连线分叉</span><span class="dot"></span>
  <span><b>右键</b> 菜单</span><span class="dot"></span>
  <span><b>滚轮</b> 缩放</span>
</div>

<script>
/* ================================================================
   演示数据：4 个工作区 / 11 张卡片 / 2 条边（与真实插件语义一致）
================================================================ */
const DATA = {
  workspaces: [
    { id: 'ws-daily',  title: '日常任务',   x: 60,  y: 70,  cols: 3 },
    { id: 'ws-medkit', title: 'Open MedKit', x: 940, y: 70,  cols: 2 },
    { id: 'ws-lab',    title: '实验场',     x: 60,  y: 400, cols: 1 },
    { id: 'ws-pract',  title: '实习',       x: 380, y: 400, cols: 2 },
  ],
  cards: [
    { id: 'c1',  ws: 'ws-daily',  title: '对话地图插件改版', body: '把卡片改成网格槽位，含退让与补位动画', time: '2 分钟前', lamp: 'running',  chip: ['running', '正在运行'], pinned: true },
    { id: 'c2',  ws: 'ws-daily',  title: '桌面自动化脚本清理', body: '清理一下临时截图和旧脚本', time: '15 分钟前', lamp: 'waiting', chip: ['waiting', '等待回复'] },
    { id: 'c3',  ws: 'ws-daily',  title: 'DSH 会话日志解析', body: '会话日志的压缩与索引方案', time: '2 小时前', lamp: 'done', chip: ['done', '待查看'] },
    { id: 'c4',  ws: 'ws-daily',  title: 'Matter.js 物理参数核算', body: '角速度 rad/frame 换算 PX_PER_M', time: '4 小时前' },
    { id: 'c5',  ws: 'ws-daily',  title: '云盘同步目录整理', body: '按月份归档，重命名规则统一', time: '45 分钟前' },
    { id: 'c6',  ws: 'ws-medkit', title: '医学数据标注流程', body: '标注、复核两段式，导出 JSON 本地校验', time: '1 小时前', lamp: 'done', chip: ['done', '待查看'] },
    { id: 'c7',  ws: 'ws-medkit', title: '标注工具离线化', body: '离线包不带网络请求，导出前先跑校验', time: '3 小时前' },
    { id: 'c8',  ws: 'ws-lab',    title: '代码实验场', body: '试验中的想法先记在这里', time: '6 小时前' },
    { id: 'c9',  ws: 'ws-pract',  title: '实习材料撰写', body: '选用豆包改写的，然后告诉我参加教研活动板块有什么要求说明', time: '3 天前', lamp: 'error', chip: ['error', '异常终止'], pinned: true },
    { id: 'c10', ws: 'ws-pract',  title: '实习材料撰写（1）', body: '你怎么又给我登录态搞掉了，我之前才登录的', time: '5 天前' },
    { id: 'c11', ws: 'ws-pract',  title: '撰写实习日志文档', body: '这里面的页码应该没啥问题吧', time: '22 天前' },
  ],
  // 有向边：from → to（未同步：虚线可见；同步中：隐藏，右键看得到）
  edges: [
    { from: 'c9', to: 'c10', synced: false },   // 实习父子对话
    { from: 'c1', to: 'c3',  synced: false },   // 日常任务里的一条关联
  ],
}

/* ================================================================ 状态 */
const state = {
  panX: 0, panY: 0, zoom: 1,
  scale: 1,               // 字号档位
  draggingCard: null,     // {id, dx, dy}
  panning: false,
  linking: null,          // {fromCard, x, y}
  drawerWs: null,
}

const board = document.getElementById('board')
const world = document.getElementById('world')
const wires = document.getElementById('wires')

/* ================================================================ 渲染 */
const CARD_W = 224, CARD_H = 120, GAP_X = 48, GAP_Y = 26

function el(tag, cls, html) {
  const node = document.createElement(tag)
  if (cls) node.className = cls
  if (html !== undefined) node.innerHTML = html
  return node
}

function cardNode(card) {
  const node = el('div', 'card' + (card.lamp ? ' lamp-' + card.lamp : ''))
  node.dataset.id = card.id
  node.innerHTML = `
    <div class="title">${card.pinned ? '<span class="pin">📌</span>' : ''}${card.title}</div>
    <div class="body">${card.body}</div>
    <div class="meta">
      <span class="time">${card.time}</span>
      ${card.chip ? `<span class="chip ${card.chip[0]}">${card.chip[1]}</span>` : ''}
    </div>`
  node.style.left = card.x + 'px'
  node.style.top = card.y + 'px'
  attachCardEvents(node, card)
  return node
}

function frameNode(ws) {
  const members = DATA.cards.filter(c => c.ws === ws.id)
  const rows = Math.ceil(members.length / ws.cols)
  const frame = el('div', 'frame')
  frame.dataset.ws = ws.id
  frame.style.left = ws.x + 'px'
  frame.style.top = ws.y + 'px'
  frame.style.setProperty('--cols', ws.cols)
  frame.style.width = ws.cols * (CARD_W + GAP_X) - GAP_X + 28 + 'px'
  frame.style.height = rows * (CARD_H + GAP_Y) - GAP_Y + 30 + 30 + 'px'
  const over = members.length - ws.cols * Math.max(rows - 1, 0) > ws.cols ? members.length : 0
  frame.innerHTML = `
    <div class="label">${ws.title}<span class="count">${members.length}</span>${members.length >= 5 ? `<span class="stackbadge" data-open="${ws.id}">›</span>` : ''}</div>`
  attachFrameEvents(frame, ws)
  return frame
}

function render() {
  world.innerHTML = ''
  world.appendChild(wires)
  DATA.workspaces.forEach(ws => world.appendChild(frameNode(ws)))
  // 所有卡片：绝对坐标定位，与 frame 同坐标系
  DATA.cards.filter(c => c.x !== undefined).forEach(card => world.appendChild(cardNode(card)))
  drawWires()
  applyFontScale()
}

/* ================================================================ 连线（与画布同一套规则） */
const MIN_SPAN = 96

function cardCenter(card) {
  const node = world.querySelector(`.card[data-id="${card.id}"]`)
  if (!node) return null
  return { x: card.x, y: card.y, w: 224, h: node.offsetHeight || 120, node }
}

function edgePath(a, b) {
  const ac = cardCenter(a), bc = cardCenter(b)
  if (!ac || !bc) return null
  const dx = (bc.x + bc.w / 2) - (ac.x + ac.w / 2)
  const dy = (bc.y + bc.h / 2) - (ac.y + ac.h / 2)
  const gapX = Math.abs(dx) - (ac.w + bc.w) / 2
  const gapY = Math.abs(dy) - (ac.h + bc.h) / 2
  const horizontalDominant = Math.abs(dx) >= Math.abs(dy)
  let sx, sy, tx, ty, sp, tp
  if (horizontalDominant && gapX >= MIN_SPAN) {
    const right = dx >= 0
    sx = right ? ac.x + ac.w : ac.x; sy = ac.y + ac.h / 2
    tx = right ? bc.x : bc.x + bc.w; ty = bc.y + bc.h / 2
    sp = right ? [1, 0] : [-1, 0]; tp = right ? [-1, 0] : [1, 0]
  } else if (!horizontalDominant && gapY >= MIN_SPAN) {
    const down = dy >= 0
    sx = ac.x + ac.w / 2; sy = down ? ac.y + ac.h : ac.y
    tx = bc.x + bc.w / 2; ty = down ? bc.y : bc.y + bc.h
    sp = [0, down ? 1 : -1]; tp = [0, down ? -1 : 1]
  } else {
    // 太近：从上下边绕出去（与画布同一规则）
    const down = ac.y + ac.h <= bc.y + bc.h
    sx = ac.x + ac.w / 2; sy = down ? ac.y + ac.h : ac.y
    tx = bc.x + bc.w / 2; ty = down ? bc.y + bc.h : bc.y
    sp = [0, down ? 1 : -1]; tp = [0, down ? 1 : -1]
  }
  const r = 8
  const d = `M ${sx} ${sy} `
    + `L ${sx + sp[0] * r} ${sy + sp[1] * r} `
    + `L ${tx - tp[0] * r - sp[0] * 0} ${ty - tp[1] * r} `
    + `L ${tx} ${ty}`
  const angle = Math.atan2(ty - (sy + sp[1] * r), tx - (sx + sp[0] * r)) * 180 / Math.PI
  return { d, tx, ty, angle }
}

function drawWires() {
  wires.innerHTML = ''
  DATA.edges.forEach(edge => {
    if (edge.synced) return   // 同步中的线不可见（与画布一致）
    const a = DATA.cards.find(c => c.id === edge.from)
    const b = DATA.cards.find(c => c.id === edge.to)
    const geo = edgePath(a, b)
    if (!geo) return
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    p.setAttribute('d', geo.d)
    p.setAttribute('class', 'edge')
    wires.appendChild(p)
    const head = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    head.setAttribute('d', 'M0 0 L-9 -4 L-9 4 Z')
    head.setAttribute('class', 'arrow')
    head.setAttribute('transform', `translate(${geo.tx} ${geo.ty}) rotate(${geo.angle})`)
    wires.appendChild(head)
    p.style.pointerEvents = 'stroke'
    p.dataset.edge = edge.from + '->' + edge.to
    p.addEventListener('contextmenu', event => {
      event.preventDefault()
      event.stopPropagation()
      openEdgeMenu(event, edge)
    })
  })
}

/* ================================================================ 平移/缩放 */
function applyTransform() {
  world.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`
}
board.addEventListener('wheel', event => {
  event.preventDefault()
  const factor = event.deltaY < 0 ? 1.08 : 1 / 1.08
  const next = Math.min(2.4, Math.max(0.35, state.zoom * factor))
  const rect = board.getBoundingClientRect()
  const mx = event.clientX - rect.left, my = event.clientY - rect.top
  state.panX = mx - (mx - state.panX) * (next / state.zoom)
  state.panY = my - (my - state.panY) * (next / state.zoom)
  state.zoom = next
  applyTransform()
}, { passive: false })

board.addEventListener('mousedown', event => {
  if (event.target.closest('.card, .frame .label, .ctxmenu, .stackbadge')) return
  state.panning = { sx: event.clientX, sy: event.clientY, ox: state.panX, oy: state.panY }
  board.classList.add('dragging')
})
window.addEventListener('mousemove', event => {
  if (state.panning) {
    state.panX = state.panning.ox + event.clientX - state.panning.sx
    state.panY = state.panning.oy + event.clientY - state.panning.sy
    applyTransform()
  }
  if (state.draggingCard) {
    const card = state.draggingCard.card
    card.x = event.clientX - state.draggingCard.dx
    card.y = event.clientY - state.draggingCard.dy
    const node = world.querySelector(`.card[data-id="${card.id}"]`)
    node.style.left = card.x + 'px'; node.style.top = card.y + 'px'
    drawWires()
  }
  if (state.linking) {
    state.linking.x = event.clientX; state.linking.y = event.clientY
    drawWires(); drawLinkGhost()
  }
})
window.addEventListener('mouseup', () => {
  state.panning = false
  board.classList.remove('dragging')
  if (state.draggingCard) { state.draggingCard = null }
  if (state.linking) {
    const ghost = wires.querySelector('.drawing')
    if (ghost) ghost.remove()
    const ghostArrow = wires.querySelector('.drawing-arrow')
    if (ghostArrow) ghostArrow.remove()
    state.linking = null
  }
})

/* ================================================================ 卡片交互 */
function attachCardEvents(node, card) {
  node.addEventListener('mousedown', event => {
    if (event.button !== 0) return
    event.stopPropagation()
    const rect = node.getBoundingClientRect()
    state.draggingCard = {
      card,
      dx: event.clientX - rect.left + state.panX - (card.x || 0) * 0,
      dy: event.clientY - rect.top + state.panY - (card.y || 0) * 0,
    }
    // 修正为世界坐标差
    state.draggingCard.dx = event.clientX - (card.x * state.zoom + state.panX)
    state.draggingCard.dy = event.clientY - (card.y * state.zoom + state.panY)
  })
  node.addEventListener('dblclick', () => toast('打开对话：' + card.title))
  node.addEventListener('contextmenu', event => {
    event.preventDefault(); event.stopPropagation()
    openCardMenu(event, card)
  })
}

function attachFrameEvents(frame, ws) {
  frame.addEventListener('mousedown', event => {
    if (event.target.closest('.card, .stackbadge')) return
    // 拖动整个框架
    const start = { x: event.clientX, y: event.clientY, ox: ws.x, oy: ws.y }
    const move = ev => {
      ws.x = start.ox + (ev.clientX - start.x) / state.zoom
      ws.y = start.oy + (ev.clientY - start.y) / state.zoom
      frame.style.left = ws.x + 'px'; frame.style.top = ws.y + 'px'
      DATA.cards.filter(c => c.ws === ws.id).forEach((card, index) => {
        const cols = ws.cols
        const col = index % cols, row = Math.floor(index / cols)
        card.x = ws.x + 14 + col * (CARD_W + GAP_X)
        card.y = ws.y + 30 + row * (CARD_H + GAP_Y)
        const node = world.querySelector(`.card[data-id="${card.id}"]`)
        if (node) { node.style.left = card.x + 'px'; node.style.top = card.y + 'px' }
      })
      drawWires()
    }
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up) }
    window.addEventListener('mousemove', move)
    window.addEventListener('mouseup', up)
  })
}

/* ================================================================ 连线绘制（从卡片边拖出） */
let linkStart = null
world.addEventListener('mousedown', event => {
  const cardNode = event.target.closest('.card')
  if (!cardNode) return
  const rect = cardNode.getBoundingClientRect()
  // 从卡片边缘 10px 内按下 = 开始连线
  const nearLeft = Math.abs(event.clientX - rect.left) < 10
  const nearRight = Math.abs(event.clientX - rect.right) < 10
  if (!nearLeft && !nearRight) return
  event.stopPropagation()
  linkStart = { card: DATA.cards.find(c => c.id === cardNode.dataset.id), side: nearLeft ? 'l' : 'r' }
  state.linking = { from: linkStart.card, x: event.clientX, y: event.clientY }
})

function drawLinkGhost() {
  let ghost = wires.querySelector('.drawing')
  if (!ghost) {
    ghost = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    ghost.setAttribute('class', 'edge drawing')
    wires.appendChild(ghost)
  }
  const card = state.linking.from
  const cc = cardCenter(card)
  const sx = linkStart.side === 'l' ? cc.x : cc.x + cc.w
  const sy = cc.y + cc.h / 2
  const boardRect = board.getBoundingClientRect()
  const tx = (state.linking.x - boardRect.left - state.panX) / state.zoom
  const ty = (state.linking.y - boardRect.top - state.panY) / state.zoom
  ghost.setAttribute('d', `M ${sx} ${sy} L ${tx} ${ty}`)
}

board.addEventListener('mouseup', event => {
  if (!state.linking) return
  const target = event.target.closest('.card')
  const from = state.linking.from
  state.linking = null
  const ghost = wires.querySelector('.drawing'); if (ghost) ghost.remove()
  if (!target || target.dataset.id === from.id) return
  const to = DATA.cards.find(c => c.id === target.dataset.id)
  const exists = DATA.edges.some(e => (e.from === from.id && e.to === to.id) || (e.from === to.id && e.to === from.id))
  if (exists) { toast('这两个卡片已经连过了'); return }
  DATA.edges.push({ from: from.id, to: to.id, synced: false })
  drawWires()
  toast(`已连线：${from.title} → ${to.title}（分叉一个携带上下文的新对话）`)
})

/* ================================================================ 右键菜单 */
const ctxmenu = document.getElementById('ctxmenu')
function openMenuAt(x, y, items) {
  ctxmenu.innerHTML = ''
  items.forEach(item => {
    if (item === '-') { ctxmenu.appendChild(el('div', 'sep')); return }
    const row = el('div', 'item', `<span class="ico">${item.ico ?? ''}</span>${item.label}`)
    row.addEventListener('click', () => { ctxmenu.classList.remove('open'); item.onPick?.() })
    ctxmenu.appendChild(row)
  })
  ctxmenu.classList.add('open')
  const mw = ctxmenu.offsetWidth, mh = ctxmenu.offsetHeight
  ctxmenu.style.left = Math.min(x, innerWidth - mw - 8) + 'px'
  ctxmenu.style.top = Math.min(y, innerHeight - mh - 8) + 'px'
}
document.addEventListener('mousedown', event => {
  if (!event.target.closest('.ctxmenu')) ctxmenu.classList.remove('open')
}, true)

function openCardMenu(event, card) {
  openMenuAt(event.clientX, event.clientY, [
    { ico: '📖', label: '打开对话', onPick: () => toast('打开对话：' + card.title) },
    { ico: '📌', label: card.pinned ? '取消置顶' : '置顶', onPick: () => { card.pinned = !card.pinned; render() } },
    { ico: '✏️', label: '重命名', onPick: () => {
        const name = prompt('重命名会话', card.title)
        if (name) { card.title = name; render() }
      } },
    { ico: '🔵', label: '标为未读', onPick: () => toast('已标为未读') },
    { ico: '🧹', label: '查看摘要', onPick: () => toast('摘要：' + card.body) },
    '-',
    { ico: '📦', label: '归档', onPick: () => toast('已归档（演示不真删）') },
    { ico: '🗑️', label: '删除', onPick: () => {
        DATA.cards = DATA.cards.filter(c => c.id !== card.id)
        DATA.edges = DATA.edges.filter(e => e.from !== card.id && e.to !== card.id)
        render()
      } },
  ])
}

function openEdgeMenu(event, edge) {
  openMenuAt(event.clientX, event.clientY, [
    { ico: '⚡', label: '开启自动推送', onPick: () => { edge.synced = true; drawWires(); toast('已开启自动推送：同步后此线隐藏') } },
    { ico: '🗑️', label: '删除连线', onPick: () => {
        DATA.edges = DATA.edges.filter(e => e !== edge)
        drawWires()
      } },
  ])
}

document.getElementById('board').addEventListener('contextmenu', event => {
  if (event.target.closest('.card, .frame, .stackbadge')) return
  event.preventDefault()
  openMenuAt(event.clientX, event.clientY, [
    { ico: '💬', label: '新建对话', onPick: () => spawnCard(event) },
    { ico: '🗂️', label: '新建工作区', onPick: () => {
        const name = prompt('工作区名称', '新工作区')
        if (!name) return
        const rect = board.getBoundingClientRect()
        DATA.workspaces.push({
          id: 'ws-' + Date.now(), title: name,
          x: (event.clientX - rect.left - state.panX) / state.zoom,
          y: (event.clientY - rect.top - state.panY) / state.zoom,
          cols: 2,
        })
        render()
      } },
  ])
})

/* 双击空白 = 新对话（落在该点所在工作区） */
board.addEventListener('dblclick', event => {
  if (event.target.closest('.card, .frame .label')) return
  spawnCard(event)
})

function spawnCard(event) {
  const rect = board.getBoundingClientRect()
  const x = (event.clientX - rect.left - state.panX) / state.zoom - CARD_W / 2
  const y = (event.clientY - rect.top - state.panY) / state.zoom - 60
  // 找落点所在工作区
  let wsId = null
  DATA.workspaces.forEach(ws => {
    const members = DATA.cards.filter(c => c.ws === ws.id)
    const fx = ws.x, fy = ws.y
    const rows = Math.ceil(members.length / ws.cols)
    const w = ws.cols * (CARD_W + GAP_X) - GAP_X + 28
    const h = rows * (CARD_H + GAP_Y) - GAP_Y + 74
    if (x >= fx && x <= fx + w && y >= fy && y <= fy + h) wsId = ws.id
  })
  const card = {
    id: 'c' + Date.now(), ws: wsId,
    title: '新对话', body: '刚从这里发起', time: '刚刚',
    x: wsId ? undefined : x, y: wsId ? undefined : y,
  }
  if (wsId) {
    const ws = DATA.workspaces.find(w => w.id === wsId)
    const members = DATA.cards.filter(c => c.ws === wsId)
    const col = members.length % ws.cols, row = Math.floor(members.length / ws.cols)
    card.x = ws.x + 14 + col * (CARD_W + GAP_X)
    card.y = ws.y + 30 + row * (CARD_H + GAP_Y)
  }
  DATA.cards.push(card)
  render()
  const node = world.querySelector(`.card[data-id="${card.id}"]`)
  node.classList.add('spawning')
  toast(wsId ? '已在该工作区发起新对话' : '已在空白处新建卡片（自由卡）')
}

/* ================================================================ 堆叠抽屉 */
const drawerBackdrop = document.getElementById('drawerBackdrop')
function openDrawer(wsId) {
  state.drawerWs = wsId
  const ws = DATA.workspaces.find(w => w.id === wsId)
  document.getElementById('drawerTitle').textContent = ws.title
  fillDrawer('')
  drawerBackdrop.classList.add('open')
}
function fillDrawer(query) {
  const ws = DATA.workspaces.find(w => w.id === state.drawerWs)
  const needle = query.trim().toLowerCase()
  const items = DATA.cards.filter(c => c.ws === ws.id
    && (needle === '' || c.title.toLowerCase().includes(needle) || c.body.toLowerCase().includes(needle)))
  document.getElementById('drawerCount').textContent = `共 ${items.length} 个对话`
  const grid = document.getElementById('drawerGrid')
  grid.innerHTML = ''
  items.forEach(card => {
    const node = document.createElement('div')
    node.className = 'card dcard' + (card.lamp ? ' lamp-' + card.lamp : '')
    node.dataset.stackCard = ''
    const title = document.createElement('div')
    title.className = 'title'
    if (card.pinned) { const pin = document.createElement('span'); pin.className='pin'; pin.textContent='📌'; title.appendChild(pin) }
    title.appendChild(document.createTextNode(card.title))
    const body = document.createElement('div')
    body.className = 'body'
    body.textContent = card.body
    const meta = document.createElement('div')
    meta.className = 'meta'
    const time = document.createElement('span')
    time.className = 'time'
    time.textContent = card.time
    meta.appendChild(time)
    if (card.chip) {
      const chip = document.createElement('span')
      chip.className = 'chip ' + card.chip[0]
      chip.textContent = card.chip[1]
      meta.appendChild(chip)
    }
    node.append(title, body, meta)
    node.addEventListener('click', () => { closeDrawer(); toast('打开对话：' + card.title) })
    grid.appendChild(node)
  })
  drawDrawerWires(items)
}
function drawDrawerWires(items) {
  // 抽屉里的连线：直接复用画布的边集合（同一份数据、同一可见性规则）
  const present = new Set(items.map(c => c.id))
  const relevant = DATA.edges.filter(e => present.has(e.from) && present.has(e.to) && !e.synced)
  if (relevant.length === 0) return
  // 在抽屉 grid 里画：简化为卡片间曲线
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0'
  relevant.forEach(edge => {
    const a = items.findIndex(c => c.id === edge.from)
    const b = items.findIndex(c => c.id === edge.to)
    if (a < 0 || b < 0) return
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    p.setAttribute('d', `M ${(a % 4) * 224 + 112} ${Math.floor(a / 4) * 150 + 60} C ${(a % 4) * 224 + 112} ${Math.floor(a / 4) * 150 + 100}, ${(b % 4) * 224 + 112} ${Math.floor(b / 4) * 150 + 100}, ${(b % 4) * 224 + 112} ${Math.floor(b / 4) * 150 + 60}`)
    p.setAttribute('stroke', 'rgba(200,206,216,0.4)')
    p.setAttribute('stroke-dasharray', '6 5')
    p.setAttribute('fill', 'none')
    svg.appendChild(p)
  })
  document.getElementById('drawerGrid').appendChild(svg)
}
function closeDrawer() { drawerBackdrop.classList.remove('open') }
document.getElementById('drawerClose').addEventListener('click', closeDrawer)
drawerBackdrop.addEventListener('click', event => { if (event.target === drawerBackdrop) closeDrawer() })
document.getElementById('drawerSearch').addEventListener('input', event => fillDrawer(event.target.value))
document.getElementById('drawerSearchBtn').addEventListener('click', () => fillDrawer(document.getElementById('drawerSearch').value))
document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeDrawer(); closeGsearch() } })

/* 点击堆叠徽标打开抽屉 */
document.addEventListener('click', event => {
  const badge = event.target.closest('.stackbadge')
  if (badge) { event.stopPropagation(); openDrawer(badge.dataset.open) }
})

/* ================================================================ 全局搜索 */
const gsearch = document.getElementById('gsearch')
function closeGsearch() { gsearch.classList.remove('open') }
document.getElementById('gsInput').addEventListener('keydown', event => {
  if (event.key !== 'Enter') return
  const q = event.target.value.trim()
  if (!q) return
  document.getElementById('gsq').textContent = q
  const hits = document.getElementById('gsHits')
  hits.innerHTML = ''
  const needle = q.toLowerCase()
  let count = 0
  DATA.cards.forEach(card => {
    const inTitle = card.title.toLowerCase().includes(needle)
    const inBody = card.body.toLowerCase().includes(needle)
    if (!inTitle && !inBody) return
    count++
    const row = el('div', 'gshit')
    const mark = text => text.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`)
    row.innerHTML = `<div style="font-size:13.5px;font-weight:600;color:#e8edf6">${mark(card.title)}</div>`
    if (!inTitle) row.innerHTML += `<div style="font-size:12px;color:var(--dim);margin-top:4px">${mark(card.body)}</div>`
    row.addEventListener('click', () => {
      closeGsearch()
      // 平移画布把卡片带到视口中央
      const rect = board.getBoundingClientRect()
      state.panX = rect.width / 2 - (card.x + CARD_W / 2) * state.zoom
      state.panY = rect.height / 2 - (card.y + CARD_H / 2) * state.zoom
      applyTransform()
      const node = world.querySelector(`.card[data-id="${card.id}"]`)
      if (node) {
        node.style.transition = 'box-shadow 0.3s'
        node.style.boxShadow = '0 0 0 2px var(--accent), 0 0 30px rgba(255,214,106,0.4)'
        setTimeout(() => { node.style.boxShadow = '' }, 1600)
      }
    })
    hits.appendChild(row)
  })
  if (count === 0) hits.innerHTML = '<div style="padding:16px 18px;color:var(--dim);font-size:13px">地图上没有找到匹配的卡片</div>'
  gsearch.classList.add('open')
})
document.addEventListener('mousedown', event => {
  if (!event.target.closest('.gsearch, #gsTrigger')) closeGsearch()
}, true)

/* ================================================================ 字号 */
function applyFontScale() {
  world.style.fontSize = 13 * state.scale + 'px'
  document.querySelectorAll('.card .title').forEach(n => n.style.fontSize = 14 * state.scale + 'px')
  document.querySelectorAll('.card .body').forEach(n => n.style.fontSize = 12 * state.scale + 'px')
}
document.getElementById('fontPlus').addEventListener('click', () => { state.scale = Math.min(1.4, state.scale + 0.1); applyFontScale() })
document.getElementById('fontMinus').addEventListener('click', () => { state.scale = Math.max(0.8, state.scale - 0.1); applyFontScale() })
document.getElementById('fontReset').addEventListener('click', () => { state.scale = 1; applyFontScale() })

/* ================================================================ toast */
let toastTimer = null
function toast(text) {
  const node = document.getElementById('toast')
  node.textContent = text
  node.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => node.classList.remove('show'), 2200)
}

/* 布局初始坐标 */
function layoutCards() {
  DATA.workspaces.forEach(ws => {
    DATA.cards.filter(c => c.ws === ws.id).forEach((card, index) => {
      const col = index % ws.cols, row = Math.floor(index / ws.cols)
      card.x = ws.x + 14 + col * (CARD_W + GAP_X)
      card.y = ws.y + 30 + row * (CARD_H + GAP_Y)
    })
  })
}
layoutCards()
render()
applyTransform()
document.getElementById('backBtn').addEventListener('click', () => toast('演示页：这里在真实插件里会返回对话'))
</script>
